# BaziDIY 领域本体（合并篇）· Apache Ossie ontology 规范 (v0.2.0.dev0)
# 涵盖：五行/干支/节气 + 珠料×变体=珠子。实例数据见 data/*.sql（SQLite）。
# 说明：Ossie 不支持跨文档引用概念，故合并为单篇自包含 ontology，避免 WuxingElement 重复声明。
version: 0.2.0.dev0
name: BazidiyOntology
description: 八字手串领域本体：五行/干支/节气、珠料×变体=珠实例，直径/颜色值类型约束。

ontology:
  # ---------------- 五行 · 干支 · 节气 ----------------
  - concept: WuxingElement
    type: EntityType
    description: 五行元素（木/火/土/金/水）
    relationships:
      - name: generates
        description: 相生：源五行生目标五行
        roles:
          - concept: WuxingElement
            name: target
        multiplicity: ManyToOne
        verbalizes:
          - "{WuxingElement} 生 {WuxingElement:target}"
      - name: restricts
        description: 相克：源五行克目标五行
        roles:
          - concept: WuxingElement
            name: target
        multiplicity: ManyToOne
        verbalizes:
          - "{WuxingElement} 克 {WuxingElement:target}"

  - concept: HeavenlyStem
    type: EntityType
    description: 天干（甲…癸）；其五行归属见数据行 element 列
  - concept: EarthlyBranch
    type: EntityType
    description: 地支（子…亥）；其五行归属见数据行 element 列
  - concept: SeasonNode
    type: EntityType
    description: 节气月分界节点（立春…小寒）；月/日见数据行

  # ---------------- 珠子 ----------------
  - concept: BeadMaterial
    type: EntityType
    description: 珠料（如 白银、南红、小叶紫檀）；材料与变体共同决定一颗珠实例

  - concept: BeadVariant
    type: EntityType
    description: 珠的形态变体（round / buddha / spacer / barrel / pixiu）

  - concept: Bead
    type: EntityType
    description: 一颗手串珠实例 = 珠料 × 变体，唯一标识由 made_of + has_variant 决定
    identify_by:
      - "made_of"
      - "has_variant"
    relationships:
      - name: made_of
        description: 该珠由哪种珠料制成
        roles:
          - concept: BeadMaterial
        multiplicity: ManyToOne
        verbalizes:
          - "{Bead} 由 {BeadMaterial} 制成"
      - name: belongs_to
        description: 该珠属哪种五行
        roles:
          - concept: WuxingElement
        multiplicity: ManyToOne
        verbalizes:
          - "{Bead} 属 {WuxingElement}"
      - name: has_variant
        description: 该珠是哪种形态变体
        roles:
          - concept: BeadVariant
        multiplicity: ManyToOne
        verbalizes:
          - "{Bead} 是 {BeadVariant} 形态"

  - concept: DiameterMm
    type: ValueType
    extends:
      - Integer
    description: 珠直径（毫米），全局允许 4~15
    requires:
      - "DiameterMm >= 4"
      - "DiameterMm <= 15"

  - concept: ColorHex
    type: ValueType
    extends:
      - String
    description: 展示颜色，十六进制形如 #RRGGBB

  # ---------------- 款式 ----------------
  - concept: StyleCode
    type: ValueType
    extends:
      - String
    description: 款式编号（B-01…B-10）

  - concept: SlotRole
    type: ValueType
    extends:
      - String
    description: 槽位角色（main/body/spacer/wuxing）
    requires:
      - "SlotRole == 'main' OR SlotRole == 'body' OR SlotRole == 'spacer' OR SlotRole == 'wuxing'"

  - concept: Slot
    type: EntityType
    description: 款式内的一个槽位（含允许的变体与直径上/下限）
    requires:
      - "has_min_dia <= has_max_dia"
      - "has_min_dia >= 4"
      - "has_max_dia <= 15"
      - "has_role"
    relationships:
      - name: has_role
        description: 槽位角色
        roles:
          - concept: SlotRole
        multiplicity: ManyToOne
        verbalizes:
          - "{Slot} 的角色是 {SlotRole}"
      - name: has_min_dia
        description: 允许最小直径（下限）
        roles:
          - concept: DiameterMm
        multiplicity: ManyToOne
        verbalizes:
          - "{Slot} 直径下限 {DiameterMm}mm"
      - name: has_max_dia
        description: 允许最大直径（上限）
        roles:
          - concept: DiameterMm
        multiplicity: ManyToOne
        verbalizes:
          - "{Slot} 直径上限 {DiameterMm}mm"
      - name: allows
        description: 该槽位允许的变体
        roles:
          - concept: BeadVariant
        multiplicity: ManyToOne
        verbalizes:
          - "{Slot} 允许 {BeadVariant}"

  - concept: Style
    type: EntityType
    description: 手串款式（B-01 素圈 / B-02 主珠 / B-03 隔片 / B-10 五行拼色）
    identify_by:
      - "style_code"
    relationships:
      - name: style_code
        description: 款式编号（唯一）
        roles:
          - concept: StyleCode
        multiplicity: OneToOne
        verbalizes:
          - "{Style} 编号为 {StyleCode}"
      - name: contains_slot
        description: 款式包含的槽位
        roles:
          - concept: Slot
        multiplicity: ManyToOne
        verbalizes:
          - "{Style} 含槽位 {Slot}"
